{% extends 'base.html' %}

{% block content %}

<style>
.donate-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    background: #f8fcfa;
}

.donate-card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border: 1px solid #dcece6;
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(39, 93, 75, 0.10);
}

.back-link {
    display: inline-block;
    color: #2c8068;
    text-decoration: none;
    font-weight: 700;
    margin-bottom: 25px;
}

.back-link:hover {
    color: #1d493e;
}

.donate-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #e7f5ef;
    color: #2c8068;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    margin-bottom: 18px;
}

.donate-card h1 {
    margin: 0 0 10px;
    font-size: 30px;
    color: #1d493e;
}

.project-name {
    color: #2c8068;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 25px;
}

.goal-box {
    background: #f1f8f5;
    border: 1px solid #dcece6;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 25px;
}

.goal-label {
    font-size: 13px;
    color: #7a8c86;
    margin-bottom: 4px;
}

.goal-value {
    font-size: 25px;
    font-weight: 800;
    color: #1d493e;
}

.donate-form p {
    margin-bottom: 18px;
}

.donate-form label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    color: #31564c;
}

.donate-form input,
.donate-form select,
.donate-form textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d7e6e0;
    border-radius: 11px;
    background: #fafdfc;
    color: #374740;
    font-size: 16px;
    outline: none;
    transition: .2s;
}

.donate-form input:focus,
.donate-form select:focus,
.donate-form textarea:focus {
    border-color: #45b995;
    box-shadow: 0 0 0 3px rgba(69, 185, 149, 0.12);
}

.donate-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #45b995;
    color: white;
    padding: 15px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
    margin-top: 5px;
}

.donate-btn:hover {
    background: #319b7d;
    transform: translateY(-1px);
}

.safe-note {
    text-align: center;
    margin-top: 18px;
    color: #8a9b95;
    font-size: 13px;
}

@media (max-width: 600px) {
    .donate-card {
        padding: 25px 20px;
    }

    .donate-card h1 {
        font-size: 25px;
    }
}
</style>

<div class="donate-page">

    <div class="donate-card">

        <a
            href="{% url 'project_detail' project.pk %}"
            class="back-link">
            ← Back to Project
        </a>

        <div class="donate-icon">
            ♥
        </div>

        <h1>
            Make a Donation
        </h1>

        <div class="project-name">
            {{ project.title }}
        </div>

        <div class="goal-box">
            <div class="goal-label">
                Project Goal
            </div>

            <div class="goal-value">
                {{ project.target|floatformat:0 }} EGP
            </div>
        </div>

        <form method="POST" class="donate-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="donate-btn">
                Donate Now
            </button>

        </form>

        <div class="safe-note">
            Thank you for supporting this project.
        </div>

    </div>

</div>

{% endblock %}
