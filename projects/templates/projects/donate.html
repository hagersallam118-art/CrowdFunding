{% extends 'base.html' %}

{% block content %}

<style>
    .donate-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        background: #f8fafc;
    }

    .donate-card {
        width: 100%;
        max-width: 520px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 22px;
        padding: 35px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    .back-link {
        display: inline-block;
        color: #15803d;
        text-decoration: none;
        font-weight: 700;
        margin-bottom: 25px;
    }

    .donate-icon {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #dcfce7;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 27px;
        margin-bottom: 18px;
    }

    .donate-card h1 {
        margin: 0 0 10px;
        font-size: 30px;
        color: #111827;
    }

    .project-name {
        color: #15803d;
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 25px;
    }

    .goal-box {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 15px;
        padding: 18px;
        margin-bottom: 25px;
    }

    .goal-label {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 4px;
    }

    .goal-value {
        font-size: 25px;
        font-weight: 800;
        color: #166534;
    }

    .donate-form p {
        margin-bottom: 18px;
    }

    .donate-form label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        color: #374151;
    }

    .donate-form input,
    .donate-form select,
    .donate-form textarea {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 11px;
        font-size: 16px;
        outline: none;
    }

    .donate-form input:focus,
    .donate-form select:focus,
    .donate-form textarea:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }

    .donate-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: #16a34a;
        color: white;
        padding: 15px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
    }

    .donate-btn:hover {
        background: #15803d;
        transform: translateY(-1px);
    }

    .safe-note {
        text-align: center;
        margin-top: 18px;
        color: #9ca3af;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .donate-card {
            padding: 25px 20px;
        }

        .donate-card h1 {
            font-size: 25px;
        }
    }
</style>

<div class="donate-page">

    <div class="donate-card">

        <a
            href="{% url 'project_detail' project.pk %}"
            class="back-link">
            ← Back to Project
        </a>

        <div class="donate-icon">
            ♥
        </div>

        <h1>
            Make a Donation
        </h1>

        <div class="project-name">
            {{ project.title }}
        </div>

        <div class="goal-box">
            <div class="goal-label">
                Project Goal
            </div>

            <div class="goal-value">
                {{ project.target|floatformat:0 }} EGP
            </div>
        </div>

        <form method="POST" class="donate-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="donate-btn">
                Donate Now
            </button>

        </form>

        <div class="safe-note">
            Thank you for supporting this project.
        </div>

    </div>

</div>

{% endblock %}
