{% extends 'base.html' %}

{% block content %}

<h1>Create Project</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <p>
        <label>Project Pictures:</label>
        <input
            type="file"
            name="images"
            accept="image/*"
            multiple
        >
    </p>

    <button type="submit">
        Create
    </button>

</form>

{% endblock %}
